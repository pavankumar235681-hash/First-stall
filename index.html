<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Stall - Billing</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;padding:15px}
.box{background:white;padding:15px;border-radius:10px}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:1px solid #ccc}
button{background:#25D366;color:white;font-weight:bold;border:none}
h2{text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>First Stall Billing</h2>
<input id="item" placeholder="Item ka naam">
<input id="price" type="number" placeholder="Price">
<input id="qty" type="number" placeholder="Qty" value="1">
<button onclick="addItem()">Add Item</button>
<hr>
<div id="bill"></div>
<h3 id="total">Total: Rs 0</h3>
<button onclick="sendWhatsApp()">WhatsApp pe Bhejo</button>
</div>
<script>
let items=[]; let total=0;
function addItem(){
 let name=document.getElementById('item').value;
 let p=parseFloat(document.getElementById('price').value);
 let q=parseFloat(document.getElementById('qty').value);
 if(!name||!p||!q)return;
 let amt=p*q; total+=amt;
 items.push(`${name} x ${q} = Rs ${amt}`);
 document.getElementById('bill').innerHTML=items.join('<br>');
 document.getElementById('total').innerText='Total: Rs '+total;
 document.getElementById('item').value='';document.getElementById('price').value='';
}
function sendWhatsApp(){
 let msg="*First Stall Bill*%0A"+items.join('%0A')+"%0A%0A*Total: Rs "+total+"*";
 window.open("https://wa.me/?text="+msg);
}
</script>
</body>
</html>
